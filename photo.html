<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视界——庐州动情瞬间</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0e;
  --bg-card: #14141a;
  --gold: #B8955A;
  --gold-dim: rgba(184,149,90,0.3);
  --text: #e8e4dc;
  --text-secondary: #a8a49c;
  --text-muted: #6a6660;
  --border: rgba(184,149,90,0.15);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Noto Serif SC', serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }

/* ===== 导航栏 ===== */
.nav {
  position: fixed; top:0; left:0; right:0; z-index:100;
  display:flex; align-items:center; justify-content:space-between;
  padding: 18px 40px;
  background: linear-gradient(180deg, rgba(10,10,14,0.9), transparent);
  backdrop-filter: blur(8px);
}
.nav-brand { display:flex; align-items:center; gap:12px; cursor:pointer; }
.nav-brand-mark {
  width:36px; height:36px; border:1px solid var(--gold);
  display:flex; align-items:center; justify-content:center;
  color:var(--gold); font-size:18px; font-weight:500;
}
.nav-brand-text { font-size:18px; letter-spacing:4px; }
.nav-brand-sub { font-size:11px; color:var(--text-muted); letter-spacing:2px; margin-top:2px; }
.nav-back {
  color:var(--text-secondary); font-size:14px; letter-spacing:2px;
  cursor:pointer; padding:8px 16px; border:1px solid var(--border);
  transition: all 0.3s;
}
.nav-back:hover { color:var(--gold); border-color:var(--gold-dim); }

/* ===== 页面容器 ===== */
.page { display:none; min-height:100vh; animation: fadeIn 0.6s ease; }
.page.active { display:block; }
@keyframes fadeIn { from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

/* ===== 封面页 ===== */
.cover {
  min-height:100vh;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background: radial-gradient(ellipse at 50% 40%, #16161e 0%, #0a0a0e 70%);
  padding: 100px 40px 60px;
  position:relative;
}
.cover::before {
  content:''; position:absolute; top:0;left:0;right:0;bottom:0;
  background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23B8955A' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  pointer-events:none;
}
.cover-title {
  font-size: clamp(60px, 10vw, 120px);
  font-weight:300;
  letter-spacing: 20px;
  color:var(--text);
  text-align:center;
  margin-bottom:16px;
  text-shadow: 0 0 60px rgba(184,149,90,0.2);
}
.cover-subtitle {
  font-size: clamp(16px, 2vw, 22px);
  color:var(--gold);
  letter-spacing: 12px;
  margin-bottom: 24px;
}
.cover-desc {
  font-size:14px; color:var(--text-muted);
  letter-spacing:3px; line-height:2;
  text-align:center; max-width:600px;
  margin-bottom: 60px;
}
.cover-divider {
  width:60px; height:1px; background:var(--gold);
  margin-bottom:60px; opacity:0.5;
}

/* 四主题入口 */
.theme-grid {
  display:grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
  max-width: 1200px;
  width:100%;
}
.theme-card {
  background: var(--bg-card);
  border:1px solid var(--border);
  padding: 36px 24px;
  cursor:pointer;
  transition: all 0.5s cubic-bezier(0.4,0,0.2,1);
  position:relative;
  overflow:hidden;
  min-height: 280px;
  display:flex; flex-direction:column;
}
.theme-card::before {
  content:''; position:absolute; top:0;left:0;right:0; height:2px;
  background:var(--gold); transform:scaleX(0); transition:transform 0.5s;
}
.theme-card:hover {
  transform: translateY(-6px);
  border-color: var(--gold-dim);
  box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 30px rgba(184,149,90,0.08);
}
.theme-card:hover::before { transform:scaleX(1); }
.theme-card-num {
  font-size:12px; color:var(--gold); letter-spacing:3px;
  margin-bottom:16px; opacity:0.7;
}
.theme-card-name {
  font-size:20px; font-weight:400; letter-spacing:3px;
  margin-bottom:14px; line-height:1.5;
}
.theme-card-desc {
  font-size:12px; color:var(--text-muted); line-height:1.9;
  flex:1;
  display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical;
  overflow:hidden;
}
.theme-card-count {
  margin-top:16px; font-size:12px; color:var(--gold);
  letter-spacing:2px; opacity:0.8;
}

/* ===== 主题页 ===== */
.theme-page {
  padding: 100px 40px 60px;
  max-width: 1400px;
  margin:0 auto;
}
.theme-header { margin-bottom:48px; }
.theme-name {
  font-size: clamp(28px, 4vw, 42px);
  font-weight:300; letter-spacing:6px;
  margin-bottom:16px;
}
.theme-intro {
  font-size:14px; color:var(--text-secondary);
  line-height:2; max-width:800px;
  letter-spacing:1px;
}
.theme-meta {
  display:flex; gap:24px; margin-top:16px;
  font-size:12px; color:var(--text-muted); letter-spacing:2px;
}
.theme-meta span { color:var(--gold); }

/* 作品网格 */
.work-grid {
  display:grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 24px;
}
.work-card {
  cursor:pointer;
  transition: all 0.4s ease;
}
.work-card-thumb {
  width:100%; aspect-ratio:4/5;
  overflow:hidden;
  border:1px solid var(--border);
  position:relative;
  background:var(--bg-card);
}
.work-card-thumb img {
  width:100%; height:100%;
  object-fit:cover;
  transition: transform 0.6s ease;
}
.work-card:hover .work-card-thumb img { transform:scale(1.05); }
.work-card-thumb::after {
  content:''; position:absolute; inset:0;
  background: linear-gradient(180deg, transparent 50%, rgba(0,0,0,0.6));
  opacity:0; transition:opacity 0.4s;
}
.work-card:hover .work-card-thumb::after { opacity:1; }
.work-card-info {
  padding:14px 4px;
}
.work-card-title {
  font-size:15px; letter-spacing:2px; margin-bottom:4px;
  transition:color 0.3s;
}
.work-card:hover .work-card-title { color:var(--gold); }
.work-card-author {
  font-size:12px; color:var(--text-muted); letter-spacing:1px;
}

/* ===== 详情页 ===== */
.detail-page {
  min-height:100vh;
  display:flex; align-items:center;
  padding: 80px 40px 40px;
}
.detail-container {
  display:grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 48px;
  max-width: 1400px;
  margin:0 auto;
  width:100%;
  align-items:center;
}
.detail-image-wrap {
  display:flex; align-items:center; justify-content:center;
  min-height: 60vh;
}
.detail-image {
  max-width:100%; max-height:80vh;
  object-fit:contain;
  border:1px solid var(--border);
  box-shadow: 0 0 80px rgba(0,0,0,0.6);
}
.detail-info { padding: 20px 0; }
.detail-title {
  font-size: clamp(28px, 4vw, 40px);
  font-weight:300; letter-spacing:6px;
  margin-bottom:12px;
}
.detail-author {
  font-size:16px; color:var(--gold);
  letter-spacing:3px; margin-bottom:32px;
}
.detail-divider {
  width:40px; height:1px; background:var(--gold-dim);
  margin-bottom:24px;
}
.detail-label {
  font-size:11px; color:var(--text-muted);
  letter-spacing:4px; margin-bottom:8px;
}
.detail-desc {
  font-size:14px; color:var(--text-secondary);
  line-height:2; margin-bottom:32px;
  min-height:40px;
}
.detail-meta {
  font-size:12px; color:var(--text-muted);
  letter-spacing:2px; line-height:2;
}
.detail-meta span { color:var(--gold); }
.detail-nav {
  display:flex; gap:12px; margin-top:40px;
}
.detail-btn {
  padding:10px 20px;
  border:1px solid var(--border);
  background:transparent;
  color:var(--text-secondary);
  font-family:inherit; font-size:13px;
  letter-spacing:2px; cursor:pointer;
  transition:all 0.3s;
}
.detail-btn:hover { color:var(--gold); border-color:var(--gold-dim); }
.detail-btn:disabled { opacity:0.3; cursor:default; }

/* ===== 页脚 ===== */
.footer {
  text-align:center; padding:40px;
  font-size:12px; color:var(--text-muted);
  letter-spacing:2px; line-height:2;
  border-top:1px solid var(--border);
}

/* ===== 响应式 ===== */
@media (max-width: 1024px) {
  .theme-grid { grid-template-columns: repeat(2,1fr); }
  .work-grid { grid-template-columns: repeat(3,1fr); }
  .detail-container { grid-template-columns:1fr; gap:32px; }
}
@media (max-width: 640px) {
  .nav { padding:14px 20px; }
  .cover { padding:80px 20px 40px; }
  .theme-grid { grid-template-columns:1fr; }
  .work-grid { grid-template-columns: repeat(2,1fr); gap:16px; }
  .theme-page, .detail-page { padding:80px 20px 40px; }
  .cover-title { letter-spacing:12px; }
}
</style>
</head>
<body>

<!-- 导航栏 -->
<nav class="nav">
  <div class="nav-brand" onclick="App.goCover()">
    <div class="nav-brand-mark">视</div>
    <div>
      <div class="nav-brand-text">视界</div>
      <div class="nav-brand-sub">庐州动情瞬间</div>
    </div>
  </div>
  <div id="navBack" style="display:none;">
    <button class="nav-back" onclick="App.goBack()">← 返回</button>
  </div>
</nav>

<!-- 封面页 -->
<div class="page active" id="page-cover">
  <div class="cover">
    <div class="cover-title">视界</div>
    <div class="cover-subtitle">庐 州 动 情 瞬 间</div>

    <div class="cover-desc">
      看见·向上的力量　遇见·光阴的诗行<br>
      听见·山河的回声　触摸·人间的烟火<br>

    </div>

</div>

<!-- 主题页 -->
<div class="page" id="page-theme">
  <div class="theme-page">
    <div class="theme-header">
      <div class="theme-name" id="themeName"></div>
      <div class="theme-intro" id="themeIntro"></div>

</div>

<!-- 详情页 -->
<div class="page" id="page-detail">

    <div class="detail-container">
      <div class="detail-image-wrap">
        <img class="detail-image" id="detailImage" src="" alt="">

      <div class="detail-info">
        <div class="detail-title" id="detailTitle"></div>

        <div class="detail-desc" id="detailDesc"></div>
        <div class="detail-meta">
          所属主题：<span id="detailTheme"></span><br>
          合肥一六八中学 · 美育课程成果
        </div>
        <div class="detail-nav">
          <button class="detail-btn" id="btnPrev" onclick="App.prevWork()">← 上一件</button>
          <button class="detail-btn" onclick="App.goBack()">返回列表</button>
          <button class="detail-btn" id="btnNext" onclick="App.nextWork()">下一件 →</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 页脚 -->
<div class="footer">
  视界——庐州动情瞬间　|　合肥一六八中学线上美育数字展厅<br>

// ===== 数据 =====
const THEMES = [
  {

    name: '看见·向上的力量',
    num: '壹',
    desc: '看见平凡，看见感动，看见价值观在光影中生长。校园里伸手相助的温暖、运动场上拼尽全力的奔跑、非遗课堂上专注的侧脸；走出校门，妈妈接我回家的目光、建筑工人挥汗如雨的身影、路口交警风雨无阻的坚守——这些平凡瞬间闪烁着真实的光亮。',
    works: [
      { id:'SW-PH001', title:'对话', author:'高仕诚', image:'3.jpg' },
      { id:'SW-PH002', title:'驰骋', author:'黄钰', image:'4.jpg' },
      { id:'SW-PH003', title:'与你同行', author:'汪敏姝', image:'7.jpg' },
      { id:'SW-PH004', title:'传承的力量', author:'金永汉', image:'8.jpg' },
      { id:'SW-PH005', title:'青春', author:'陈美锡', image:'9.jpg' },
      { id:'SW-PH006', title:'篮球梦', author:'刘亚洲', image:'10.jpg' },
      { id:'SW-PH007', title:'起飞', author:'祖天佑', image:'56.jpg' },
      { id:'SW-PH008', title:'晨光', author:'汪杰瑞', image:'12.jpg' },
      { id:'SW-PH009', title:'心灵休憩站', author:'佘逸珺', image:'33.jpg' },
      { id:'SW-PH010', title:'专注', author:'陈羽晨', image:'11.jpg' },
      { id:'SW-PH011', title:'冲刺', author:'梅宇轩', image:'48.jpg' }
    ]
  },
  {
    id: 'meet',
    name: '遇见·光阴的诗行',
    num: '贰',
    desc: '在日常中遇见诗意，让光影成为另一种语言。枝头初绽的花苞、秋天飘落的树叶、雨后初晴的水洼、季节更迭中悄然变化的色彩——诗意并不遥远，它就藏在这些日常画面里。我们尝试用镜头与古诗对话，按下快门的那一刻，觉得自己读懂了他们。',
    works: [
      { id:'SW-PH012', title:'春日影', author:'杨斯语', image:'19.jpg' },
      { id:'SW-PH013', title:'跃上枝头', author:'梅宇轩', image:'27.jpg' },
      { id:'SW-PH014', title:'洁', author:'李若溪', image:'65.jpg' },
      { id:'SW-PH015', title:'清莲', author:'李若溪', image:'67.jpg' },
      { id:'SW-PH016', title:'一荷盛夏', author:'李若溪', image:'69.jpg' },
      { id:'SW-PH017', title:'翠拥荷韵', author:'周珠怡', image:'38.jpg' },
      { id:'SW-PH018', title:'逆光', author:'毛可欣', image:'66.jpg' },
      { id:'SW-PH019', title:'玉盘珍珠', author:'张跃轩', image:'55.jpg' },
      { id:'SW-PH020', title:'花之舞', author:'高仕诚', image:'13.jpg' },
      { id:'SW-PH021', title:'电流原野', author:'史谦予', image:'40.jpg' },
      { id:'SW-PH022', title:'生长的力量', author:'徐子祺', image:'43.jpg' },
      { id:'SW-PH023', title:'翠叶斑蝶', author:'张一驰', image:'16.jpg' },
      { id:'SW-PH024', title:'依偎', author:'史谦予', image:'15.jpg' },
      { id:'SW-PH025', title:'枝', author:'王奕涵', image:'21.jpg' },
      { id:'SW-PH026', title:'花语', author:'席心怡', image:'24.jpg' },
      { id:'SW-PH027', title:'春意', author:'席欣怡', image:'49.jpg' }
    ]
  },
  {
    id: 'hear',
    name: '听见·山河的回声',
    num: '叁',
    desc: '走出校园，世界变得更加辽阔。从一棵树的四季轮转，看到时间的形状；从自然的山脉与河流，读懂天地的尺度。清晨草叶上的露珠、黄昏漫天的晚霞，都被装进取景框里。这个过程让我们学会等待与敬畏——这些作品，既是记录，也是与天地对话的方式。',
    works: [
      { id:'SW-PH028', title:'森林之夜', author:'梅宇轩', image:'1.jpg' },
      { id:'SW-PH029', title:'银河', author:'阚彦彬', image:'62.jpg' },
      { id:'SW-PH030', title:'暮色织梦，银翼为针', author:'史谦予', image:'42.jpg' },
      { id:'SW-PH031', title:'树影婆娑', author:'巫怡青', image:'60.jpg' },
      { id:'SW-PH032', title:'童年碧影', author:'杨斯语', image:'51.jpg' },
      { id:'SW-PH033', title:'麦穗', author:'巫怡青', image:'18.jpg' },
      { id:'SW-PH034', title:'望', author:'李若溪', image:'39.jpg' },
      { id:'SW-PH035', title:'落日', author:'巫怡青', image:'47.jpg' },
      { id:'SW-PH036', title:'落日余辉', author:'汪杰瑞', image:'71.jpg' },
      { id:'SW-PH037', title:'斗转星移', author:'梅宇轩', image:'26.jpg' }
    ]
  },
  {
    id: 'touch',
    name: '触摸·人间的烟火',
    num: '肆',
    desc: '走入街巷与人群，触摸生活的温度，也感受人间的呼吸。寻常巷陌的祖孙背影、草地上迎风起飞的风筝、老街深处斑驳的旧影、江面上缓缓划过的渔舟、舞台下舒展投入的舞姿——我们用镜头定格那些真实而生动的瞬间。',
    works: [
      { id:'SW-PH038', title:'眸', author:'杨斯语', image:'5.jpg' },
      { id:'SW-PH039', title:'雨夜', author:'杨斯语', image:'6.jpg' },
      { id:'SW-PH040', title:'童年', author:'陈易坤', image:'30.jpg' },
      { id:'SW-PH041', title:'雨夜', author:'张跃轩', image:'54.jpg' },
      { id:'SW-PH042', title:'祖孙俩', author:'杨斯语', image:'52.jpg' },
      { id:'SW-PH043', title:'回眸', author:'邓志安', image:'20.jpg' },
      { id:'SW-PH044', title:'等待', author:'沈厚宇', image:'22.jpg' },
      { id:'SW-PH045', title:'城市', author:'解毅修', image:'29.jpg' },
      { id:'SW-PH046', title:'蓝天翼影', author:'石宇轩', image:'31.jpg' },
      { id:'SW-PH047', title:'守岁月', author:'杨斯语', image:'50.jpg' },
      { id:'SW-PH048', title:'彩色的梦', author:'徐若涵', image:'36.jpg' }
    ]
  }
];

// ===== 应用逻辑 =====
const App = (function() {
  let currentTheme = null;
  let currentWorkIndex = 0;
  let history = ['cover'];

  function showPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + id).classList.add('active');
    window.scrollTo(0, 0);
    document.getElementById('navBack').style.display = (id === 'cover') ? 'none' : 'block';
  }

  function goCover() {
    currentTheme = null;
    history = ['cover'];
    showPage('cover');
  }

  function goBack() {
    if (history.length > 1) {
      history.pop();
      const prev = history[history.length - 1];
      if (prev === 'cover') { goCover(); return; }
      if (prev === 'theme') { showTheme(currentTheme.id); return; }
    }
    goCover();
  }

  function renderThemes() {
    const grid = document.getElementById('themeGrid');
    grid.innerHTML = THEMES.map(t => `
      <div class="theme-card" onclick="App.openTheme('${t.id}')">
        <div class="theme-card-num">${t.num} · ${t.works.length} 件作品</div>
        <div class="theme-card-name">${t.name}</div>
        <div class="theme-card-desc">${t.desc}</div>
        <div class="theme-card-count">进入展厅 →</div>
      </div>
    `).join('');
  }

  function openTheme(themeId) {
    currentTheme = THEMES.find(t => t.id === themeId);
    if (!currentTheme) return;
    history.push('theme');
    showPage('theme');
    document.getElementById('themeName').textContent = currentTheme.name;
    document.getElementById('themeIntro').textContent = currentTheme.desc;
    document.getElementById('themeCount').textContent = currentTheme.works.length;

    const grid = document.getElementById('workGrid');
    grid.innerHTML = currentTheme.works.map((w, i) => `
      <div class="work-card" onclick="App.openWork(${i})">
        <div class="work-card-thumb">
          <img src="${w.image}" alt="${w.title}" loading="lazy">
        </div>
        <div class="work-card-info">
          <div class="work-card-title">${w.title}</div>
          <div class="work-card-author">${w.author}</div>
        </div>
      </div>
    `).join('');
  }

  function openWork(index) {
    currentWorkIndex = index;
    history.push('detail');
    renderWork();
    showPage('detail');
  }

  function renderWork() {
    const w = currentTheme.works[currentWorkIndex];
    document.getElementById('detailImage').src = w.image;
    document.getElementById('detailImage').alt = w.title;
    document.getElementById('detailTitle').textContent = w.title;
    document.getElementById('detailAuthor').textContent = w.author;
    document.getElementById('detailDesc').textContent = w.desc || '——';
    document.getElementById('detailTheme').textContent = currentTheme.name;
    document.getElementById('btnPrev').disabled = (currentWorkIndex === 0);
    document.getElementById('btnNext').disabled = (currentWorkIndex === currentTheme.works.length - 1);
  }

  function prevWork() {
    if (currentWorkIndex > 0) {
      currentWorkIndex--;
      renderWork();
    }
  }

  function nextWork() {
    if (currentWorkIndex < currentTheme.works.length - 1) {
      currentWorkIndex++;
      renderWork();
    }
  }

  // 键盘导航
  document.addEventListener('keydown', function(e) {
    if (!document.getElementById('page-detail').classList.contains('active')) return;
    if (e.key === 'ArrowLeft') prevWork();
    if (e.key === 'ArrowRight') nextWork();
    if (e.key === 'Escape') goBack();
  });

  // 初始化
  renderThemes();

  return {
    goCover, goBack, openTheme, openWork, prevWork, nextWork
  };
})();
</script>
</body>
</html>
