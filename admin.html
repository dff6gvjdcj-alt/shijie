<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>后台管理 —— 俯仰之间</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="admin-body">

  <!-- ============ 登录页 ============ -->
  <div class="admin-login" id="loginPage">
    <div class="admin-login-card">
      <div class="admin-login-logo">
        <div class="admin-login-mark">俯</div>
        <h1>俯仰之间</h1>
        <p>合肥一六八中学线上美育数字展厅 · 后台管理</p>
      </div>
      <form class="admin-login-form" id="loginForm" onsubmit="return Admin.doLogin(event)">
        <div class="admin-form-group">
          <label>管理员账号</label>
          <input type="text" id="loginUsername" placeholder="请输入账号" autocomplete="username">
        </div>
        <div class="admin-form-group">
          <label>密码</label>
          <input type="password" id="loginPassword" placeholder="请输入密码" autocomplete="current-password">
        </div>
        <div class="admin-login-error" id="loginError"></div>
        <button type="submit" class="admin-btn admin-btn-primary admin-btn-block">登 录</button>
        <div class="admin-login-hint">
          <a href="index.html">← 返回前台展厅</a>
        </div>
      </form>
    </div>
  </div>

  <!-- ============ 后台主界面 ============ -->
  <div class="admin-layout" id="adminLayout" style="display:none;">
    <!-- 侧边栏 -->
    <aside class="admin-sidebar">
      <div class="admin-sidebar-brand">
        <div class="admin-sidebar-mark">俯</div>
        <div>
          <div class="admin-sidebar-title">俯仰之间</div>
          <div class="admin-sidebar-sub">后台管理系统</div>
        </div>
      </div>
      <nav class="admin-sidebar-nav">
        <a class="admin-nav-item active" data-page="dashboard" onclick="Admin.navigate('dashboard')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          数据概览
        </a>
        <a class="admin-nav-item" data-page="works" onclick="Admin.navigate('works')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
          作品管理
        </a>
        <a class="admin-nav-item" data-page="exhibitions" onclick="Admin.navigate('exhibitions')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          画展管理
        </a>
        <a class="admin-nav-item" data-page="themes" onclick="Admin.navigate('themes')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
          主题标签
        </a>
      </nav>
      <div class="admin-sidebar-footer">
        <div class="admin-user-info">
          <div class="admin-user-avatar" id="userAvatar">A</div>
          <div>
            <div class="admin-user-name" id="userName">admin</div>
            <div class="admin-user-role">管理员</div>
          </div>
        </div>
        <button class="admin-logout-btn" onclick="Admin.logout()">退出登录</button>
      </div>
    </aside>

    <!-- 主内容区 -->
    <main class="admin-main">
      <!-- 数据概览 -->
      <div class="admin-page" id="page-dashboard">
        <div class="admin-page-header">
          <h1>数据概览</h1>
          <a href="index.html" class="admin-btn admin-btn-outline" target="_blank">查看前台 →</a>
        </div>
        <div class="admin-stats-grid" id="statsGrid"></div>
        <div class="admin-recent-section">
          <h2>最近新增作品</h2>
          <div class="admin-recent-list" id="recentList"></div>
        </div>
      </div>

      <!-- 作品管理 -->
      <div class="admin-page" id="page-works" style="display:none;">
        <div class="admin-page-header">
          <h1>作品管理</h1>
          <button class="admin-btn admin-btn-primary" onclick="Admin.showWorkForm()">+ 新增作品</button>
        </div>
        <!-- 筛选栏 -->
        <div class="admin-filter-bar">
          <select id="filterZone" onchange="Admin.filterWorks()">
            <option value="">全部分区</option>
          </select>
          <select id="filterMedium" onchange="Admin.filterWorks()">
            <option value="">全部媒介</option>
          </select>
          <select id="filterExhibition" onchange="Admin.filterWorks()">
            <option value="">全部画展</option>
          </select>
          <select id="filterTheme" onchange="Admin.filterWorks()">
            <option value="">全部主题</option>
          </select>
          <input type="text" id="searchInput" placeholder="搜索作品名称或作者..." oninput="Admin.filterWorks()">
        </div>
        <!-- 批量操作栏 -->
        <div class="admin-batch-bar">
          <label class="admin-checkbox-label">
            <input type="checkbox" id="selectAll" onchange="Admin.toggleSelectAll(this)">
            全选
          </label>
          <span class="admin-selected-count" id="selectedCount">已选 0 项</span>
          <button class="admin-btn admin-btn-danger" id="batchDeleteBtn" disabled onclick="Admin.batchDelete()">批量删除</button>
        </div>
        <!-- 作品表格 -->
        <div class="admin-table-wrap">
          <table class="admin-table" id="worksTable">
            <thead>
              <tr>
                <th style="width:40px;"></th>
                <th>作品编号</th>
                <th>作品名称</th>
                <th>作者</th>
                <th>分区</th>
                <th>媒介</th>
                <th>画展</th>
                <th>主题</th>
                <th>上传时间</th>
                <th style="width:120px;">操作</th>
              </tr>
            </thead>
            <tbody id="worksTableBody"></tbody>
          </table>
        </div>
      </div>

      <!-- 画展管理 -->
      <div class="admin-page" id="page-exhibitions" style="display:none;">
        <div class="admin-page-header">
          <h1>画展管理</h1>
          <button class="admin-btn admin-btn-primary" onclick="Admin.showExhibitionForm()">+ 新增画展</button>
        </div>
        <div id="exhibitionsList"></div>
      </div>

      <!-- 主题标签管理 -->
      <div class="admin-page" id="page-themes" style="display:none;">
        <div class="admin-page-header">
          <h1>主题标签管理</h1>
        </div>
        <div id="themesList"></div>
      </div>
    </main>
  </div>

  <!-- ============ 作品表单弹窗 ============ -->
  <div class="admin-modal" id="workFormModal">
    <div class="admin-modal-content">
      <div class="admin-modal-header">
        <h2 id="workFormTitle">新增作品</h2>
        <button class="admin-modal-close" onclick="Admin.closeModal('workFormModal')">×</button>
      </div>
      <form class="admin-modal-body" id="workForm" onsubmit="return Admin.saveWork(event)">
        <input type="hidden" id="workId">
        <div class="admin-form-row">
          <div class="admin-form-group">
            <label>所属分区 <span class="admin-required">*</span></label>
            <select id="workZone" onchange="Admin.onWorkZoneChange()" required>
              <option value="">请选择分区</option>
            </select>
          </div>
          <div class="admin-form-group">
            <label>所属媒介 <span class="admin-required">*</span></label>
            <select id="workMedium" onchange="Admin.onWorkMediumChange()" required>
              <option value="">请先选择分区</option>
            </select>
          </div>
        </div>
        <div class="admin-form-row">
          <div class="admin-form-group">
            <label>所属画展 <span class="admin-required">*</span></label>
            <select id="workExhibition" onchange="Admin.onWorkExhibitionChange()" required>
              <option value="">请先选择媒介</option>
            </select>
          </div>
          <div class="admin-form-group">
            <label>所属主题 <span class="admin-required">*</span></label>
            <select id="workTheme" required>
              <option value="">请先选择画展</option>
            </select>
          </div>
        </div>
        <div class="admin-form-row">
          <div class="admin-form-group">
            <label>作品名称 <span class="admin-required">*</span></label>
            <input type="text" id="workTitle" placeholder="请输入作品名称" required>
          </div>
          <div class="admin-form-group">
            <label>作者姓名 <span class="admin-required">*</span></label>
            <input type="text" id="workAuthor" placeholder="请输入作者姓名" required>
          </div>
        </div>
        <div class="admin-form-group">
          <label>作品图片</label>
          <div class="admin-upload-area" id="uploadArea"
               ondragover="Admin.onDragOver(event)"
               ondragleave="Admin.onDragLeave(event)"
               ondrop="Admin.onDrop(event)"
               onclick="document.getElementById('workImageInput').click()">
            <input type="file" id="workImageInput" accept="image/jpeg,image/png" style="display:none;" onchange="Admin.onImageSelect(event)">
            <div class="admin-upload-placeholder" id="uploadPlaceholder">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              <p>点击或拖拽图片到此处上传</p>
              <p class="admin-upload-hint">支持 JPG / PNG，自动压缩至最长边1200px</p>
            </div>
            <div class="admin-upload-preview" id="uploadPreview" style="display:none;">
              <img id="previewImg" src="" alt="预览">
              <div class="admin-upload-info" id="uploadInfo"></div>
              <button type="button" class="admin-upload-remove" onclick="event.stopPropagation(); Admin.removeImage()">更换图片</button>
            </div>
          </div>
        </div>
        <div class="admin-form-group">
          <label>创作说明 <span class="admin-char-count">(<span id="descCount">0</span>/200)</span></label>
          <textarea id="workDesc" rows="4" maxlength="200" placeholder="请输入创作说明（限200字）" oninput="Admin.updateDescCount()"></textarea>
        </div>
        <div class="admin-modal-footer">
          <button type="button" class="admin-btn admin-btn-outline" onclick="Admin.closeModal('workFormModal')">取消</button>
          <button type="submit" class="admin-btn admin-btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ============ 画展表单弹窗 ============ -->
  <div class="admin-modal" id="exhibitionFormModal">
    <div class="admin-modal-content">
      <div class="admin-modal-header">
        <h2 id="exhibitionFormTitle">新增画展</h2>
        <button class="admin-modal-close" onclick="Admin.closeModal('exhibitionFormModal')">×</button>
      </div>
      <form class="admin-modal-body" id="exhibitionForm" onsubmit="return Admin.saveExhibition(event)">
        <input type="hidden" id="exhibitionId">
        <div class="admin-form-row">
          <div class="admin-form-group">
            <label>所属分区 <span class="admin-required">*</span></label>
            <select id="exhibitionZone" onchange="Admin.onExhibitionZoneChange()" required>
              <option value="">请选择分区</option>
            </select>
          </div>
          <div class="admin-form-group">
            <label>所属媒介 <span class="admin-required">*</span></label>
            <select id="exhibitionMedium" required>
              <option value="">请先选择分区</option>
            </select>
          </div>
        </div>
        <div class="admin-form-group">
          <label>画展名称 <span class="admin-required">*</span></label>
          <input type="text" id="exhibitionName" placeholder="请输入画展名称" required>
        </div>
        <div class="admin-form-group">
          <label>简短说明</label>
          <textarea id="exhibitionDesc" rows="3" placeholder="请输入画展简短说明"></textarea>
        </div>
        <div class="admin-form-group">
          <label>封面图片</label>
          <div class="admin-upload-area admin-upload-area-sm" id="exCoverUploadArea"
               onclick="document.getElementById('exCoverInput').click()">
            <input type="file" id="exCoverInput" accept="image/jpeg,image/png" style="display:none;" onchange="Admin.onExCoverSelect(event)">
            <div class="admin-upload-placeholder" id="exCoverPlaceholder">
              <p>点击上传封面（可选）</p>
            </div>
            <div class="admin-upload-preview" id="exCoverPreview" style="display:none;">
              <img id="exCoverImg" src="" alt="封面预览" style="max-height:120px;">
            </div>
          </div>
        </div>
        <div class="admin-modal-footer">
          <button type="button" class="admin-btn admin-btn-outline" onclick="Admin.closeModal('exhibitionFormModal')">取消</button>
          <button type="submit" class="admin-btn admin-btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ============ 主题表单弹窗 ============ -->
  <div class="admin-modal" id="themeFormModal">
    <div class="admin-modal-content admin-modal-content-sm">
      <div class="admin-modal-header">
        <h2 id="themeFormTitle">新增主题</h2>
        <button class="admin-modal-close" onclick="Admin.closeModal('themeFormModal')">×</button>
      </div>
      <form class="admin-modal-body" id="themeForm" onsubmit="return Admin.saveTheme(event)">
        <input type="hidden" id="themeId">
        <input type="hidden" id="themeZoneId">
        <input type="hidden" id="themeMediumId">
        <input type="hidden" id="themeExhibitionId">
        <div class="admin-form-group">
          <label>主题名称 <span class="admin-required">*</span></label>
          <input type="text" id="themeName" placeholder="请输入主题名称" required>
        </div>
        <div class="admin-form-group">
          <label>板块介绍</label>
          <textarea id="themeDesc" rows="3" placeholder="请输入板块介绍（2-3句话）"></textarea>
        </div>
        <div class="admin-modal-footer">
          <button type="button" class="admin-btn admin-btn-outline" onclick="Admin.closeModal('themeFormModal')">取消</button>
          <button type="submit" class="admin-btn admin-btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ============ 确认弹窗 ============ -->
  <div class="admin-confirm-modal" id="confirmModal">
    <div class="admin-confirm-content">
      <div class="admin-confirm-icon">!</div>
      <div class="admin-confirm-text" id="confirmText">确认操作？</div>
      <div class="admin-confirm-btns">
        <button class="admin-btn admin-btn-outline" onclick="Admin.closeConfirm()">取消</button>
        <button class="admin-btn admin-btn-danger" id="confirmOkBtn">确认</button>
      </div>
    </div>
  </div>

  <!-- ============ Toast 提示 ============ -->
  <div class="admin-toast" id="adminToast"></div>

  <!-- ============ 脚本 ============ -->
  <script src="data.js"></script>
  <script src="store.js"></script>
  <script>Store.init();</script>
  <script src="admin.js"></script>
</body>
</html>
